<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>POLYBOT</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Светло-серая панель с объёмом: выпуклые карточки и клавиши, утопленные экраны.
     Цвета нет — только серый; направление несут стрелки ▲▼ и вес шрифта.
     График: линия 2px тёмно-серым (светлые оттенки не проходят по контрасту),
     заливка тем же тоном ~15%, сетка — волосяная линия на шаг от фона. */
  :root {
    --bg:        #e6e8ec;
    --card-hi:   #fafbfc;
    --card:      #f1f3f6;
    --well:      #e9ebef;   /* утопленные экраны */
    --line:      #d7dbe2;
    --ink:       #23272e;
    --mid:       #4b5563;   /* 6.8:1 к карточке */
    --dim:       #6b7280;   /* 4.35:1 — читаемо даже в 10px */
    --mark:      #3f4650;   /* цвет данных: контраст к фону выше 8:1 */
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --raise: 0 1px 0 rgba(255,255,255,.95) inset, 0 -1px 0 rgba(35,39,46,.06) inset,
             0 1px 2px rgba(28,32,40,.07), 0 8px 18px rgba(28,32,40,.09);
    --press: inset 0 2px 5px rgba(28,32,40,.14), inset 0 -1px 0 rgba(255,255,255,.75);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); }
  body {
    margin: 0; padding: 0 0 88px; color: var(--ink); font-family: var(--sans);
    font-size: 13px; line-height: 1.5; -webkit-font-smoothing: antialiased;
    background: radial-gradient(140% 70% at 50% 0%, #f2f4f7 0%, #e6e8ec 60%, #dcdfe5 100%);
    background-attachment: fixed;
  }
  .num, table, .big, .tape { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .dim { color: var(--dim); } .mid { color: var(--mid); }
  .up { color: var(--ink); font-weight: 600; }
  .down { color: var(--mid); }

  /* --- бегущая строка: утопленный жёлоб -------------------------------------- */
  .tape {
    position: sticky; top: 0; z-index: 6; overflow: hidden; white-space: nowrap;
    padding: 7px 0; font-size: 11px; color: var(--mid);
    background: var(--well); box-shadow: var(--press);
  }
  .tape-inner { display: inline-block; padding-left: 12px; animation: scroll 46s linear infinite; }
  .tape span { margin-right: 22px; }
  .tape b { color: var(--ink); }
  @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  @media (prefers-reduced-motion: reduce) { .tape-inner { animation: none; } }

  /* --- карточки --------------------------------------------------------------- */
  .wrap { padding: 12px; display: grid; gap: 12px; }
  /* min-width:0 обязателен: иначе неразрывный текст внутри грида растягивает страницу */
  .wrap, .wrap > *, .panel, .body, .tile { min-width: 0; }
  .panel {
    border-radius: 16px; box-shadow: var(--raise);
    background: linear-gradient(180deg, var(--card-hi), var(--card));
  }
  .head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 16px 8px; font-size: 10.5px; font-weight: 600;
    letter-spacing: 1px; text-transform: uppercase; color: var(--dim);
  }
  .body { padding: 0 16px 16px; }

  /* --- главное число ---------------------------------------------------------- */
  .big { font-size: 34px; font-weight: 600; letter-spacing: -1.2px; line-height: 1.1; }
  .sub { margin-top: 2px; color: var(--mid); font-size: 12.5px; }

  /* утопленный экран графика */
  .well { position: relative; margin-top: 14px; border-radius: 12px;
          background: var(--well); box-shadow: var(--press); padding: 10px 12px 8px; }
  svg { display: block; width: 100%; height: 92px; overflow: visible; }
  .range { position: absolute; right: 12px; font-size: 10px; color: var(--dim);
           font-family: var(--mono); }
  .range.hi { top: 8px; } .range.lo { bottom: 6px; }
  .bubble {
    position: absolute; transform: translate(-50%, -100%); pointer-events: none;
    background: var(--ink); color: #fff; font-family: var(--mono); font-size: 10.5px;
    padding: 3px 7px; border-radius: 7px; white-space: nowrap; opacity: 0;
    transition: opacity .12s;
  }

  /* --- плитки ---------------------------------------------------------------- */
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
  .tiles.four { grid-template-columns: repeat(2, 1fr); }
  .tile {
    border-radius: 12px; padding: 10px 12px;
    background: linear-gradient(180deg, #fdfdfe, var(--card));
    box-shadow: 0 1px 0 rgba(255,255,255,.9) inset, 0 2px 5px rgba(28,32,40,.08);
  }
  .tile b { display: block; font-family: var(--mono); font-size: 16px; font-weight: 600;
            letter-spacing: -.4px; }
  .tile span { font-size: 10.5px; color: var(--dim); }

  /* --- таблица позиций -------------------------------------------------------- */
  /* фиксированная раскладка: колонки никогда не выталкивают страницу за экран */
  table { width: 100%; border-collapse: collapse; font-size: 12px; table-layout: fixed; }
  th { text-align: left; font-family: var(--sans); font-size: 10px; font-weight: 600;
       letter-spacing: .7px; text-transform: uppercase; color: var(--dim);
       padding-bottom: 8px; border-bottom: 1px solid var(--line); }
  th, td { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  td { padding: 9px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  tbody tr:last-child td { border-bottom: 0; }
  col.c-name { width: 46%; } col.c-mid { width: 27%; } col.c-pnl { width: 27%; }
  .num { text-align: right; }
  .sub-line { display: block; font-size: 10.5px; color: var(--dim); font-family: var(--sans);
              margin-top: 3px; }

  .chip {
    display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 10px;
    font-weight: 600; color: var(--mid);
    background: linear-gradient(180deg, #fff, #eceef2);
    box-shadow: 0 1px 0 rgba(255,255,255,.9) inset, 0 1px 2px rgba(28,32,40,.12);
  }

  /* --- лента ------------------------------------------------------------------ */
  .log { max-height: 230px; overflow-y: auto; }
  .log div { padding: 6px 0; border-bottom: 1px solid var(--line); color: var(--mid);
             white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .log div:last-child { border-bottom: 0; }
  .log .t { font-family: var(--mono); font-size: 10.5px; color: var(--dim); margin-right: 8px; }
  .tag {
    display: inline-block; min-width: 62px; text-align: center; font-size: 9.5px;
    font-weight: 600; letter-spacing: .4px; padding: 2px 6px; margin-right: 8px;
    border-radius: 999px; color: var(--mid);
    background: linear-gradient(180deg, #fff, #eceef2);
    box-shadow: 0 1px 0 rgba(255,255,255,.9) inset, 0 1px 2px rgba(28,32,40,.12);
  }
  .tag.hi { color: var(--ink); }
  .empty { color: var(--dim); padding: 10px 0; }

  .gauge { height: 8px; border-radius: 999px; margin-top: 10px;
           background: var(--well); box-shadow: var(--press); overflow: hidden; }
  .gauge > i { display: block; height: 100%; border-radius: 999px;
               background: linear-gradient(180deg, #7e8695, var(--mark)); }

  /* --- клавиши ---------------------------------------------------------------- */
  .keys {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 8;
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    background: linear-gradient(180deg, rgba(230,232,236,.6), var(--bg) 60%);
    backdrop-filter: blur(10px);
  }
  .keys button {
    border: 0; border-radius: 13px; cursor: pointer; padding: 13px 4px;
    font-family: var(--sans); font-size: 12px; font-weight: 600; color: var(--mid);
    background: linear-gradient(180deg, #fdfdfe, #e9ebef);
    box-shadow: 0 1px 0 rgba(255,255,255,.95) inset, 0 3px 0 #cdd2da,
                0 6px 12px rgba(28,32,40,.14);
    transition: transform .06s, box-shadow .06s;
  }
  .keys button:active {
    transform: translateY(3px);
    box-shadow: inset 0 2px 5px rgba(28,32,40,.2);
  }
  .keys button:disabled { color: #b3b9c4; }
  .keys .lit { color: var(--ink); box-shadow: inset 0 2px 5px rgba(28,32,40,.18); }

  .cursor::after { content: "▌"; color: var(--dim); animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .alert { box-shadow: var(--raise), 0 0 0 2px rgba(35,39,46,.35); }
</style>
</head>
<body data-palette="#3f4650">

<div class="tape"><div class="tape-inner" id="tape"></div></div>

<div class="wrap">

  <div class="panel" id="head-panel">
    <div class="head"><span id="mode">polybot · paper</span><span id="uptime"></span></div>
    <div class="body">
      <div class="big" id="equity">$0.00</div>
      <div class="sub" id="pnl">—</div>

      <div class="well" id="well">
        <span class="range hi" id="range-hi"></span>
        <span class="range lo" id="range-lo"></span>
        <svg id="chart" viewBox="0 0 320 92" preserveAspectRatio="none"></svg>
        <div class="bubble" id="bubble"></div>
      </div>

      <div class="tiles">
        <div class="tile"><b id="day">—</b><span>сегодня</span></div>
        <div class="tile"><b id="cash">—</b><span>свободно</span></div>
        <div class="tile"><b id="exposure">—</b><span>в рынке</span></div>
      </div>

      <div class="sub dim cursor" id="status" style="margin-top:12px"></div>
    </div>
  </div>

  <div class="panel">
    <div class="head"><span>позиции</span><span id="pos-count"></span></div>
    <div class="body" id="positions"></div>
  </div>

  <div class="panel">
    <div class="head"><span>лента</span><span id="cycles"></span></div>
    <div class="body log" id="log"></div>
  </div>

  <div class="panel">
    <div class="head"><span>метрики</span><span id="strategy-note"></span></div>
    <div class="body" id="metrics"></div>
  </div>

</div>

<div class="keys">
  <button id="refresh">Обновить</button>
  <button id="pause">Пауза</button>
  <button id="flat">Закрыть всё</button>
  <button id="mode-btn">Инфо</button>
</div>

<script>
const tg = window.Telegram ? window.Telegram.WebApp : null;
if (tg) {
  tg.ready(); tg.expand();
  try { tg.setHeaderColor("#e6e8ec"); tg.setBackgroundColor("#e6e8ec"); } catch (e) {}
}
const initData = tg ? tg.initData : "";
let state = null, busy = false, curve = [];

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// монохром: направление несут стрелка и насыщенность текста, не цвет
const arrow = (v) => (v > 0 ? "▲" : v < 0 ? "▼" : "");
const cls = (v) => (v > 0 ? "up" : v < 0 ? "down" : "dim");
const money = (v) => arrow(v) + "$" + Math.abs(v).toFixed(2);
const short$ = (v) => "$" + Math.round(Math.abs(v)).toLocaleString("en-US");
const hhmmss = (ts) => new Date(ts * 1000).toTimeString().slice(0, 8);
const cut = (s, n) => (s.length > n ? s.slice(0, n - 1) + "…" : s);

async function call(path, extra) {
  const res = await fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(Object.assign({ initData }, extra || {})),
  });
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.error || "HTTP " + res.status);
  }
  return res.json();
}

/* --- график: одна серия, поэтому без легенды; крайние значения подписаны ----- */
function chart(values) {
  const svg = $("chart");
  curve = values || [];
  if (curve.length < 2) { svg.innerHTML = ""; return; }
  const lo = Math.min(...curve), hi = Math.max(...curve), span = (hi - lo) || 1;
  const step = 320 / (curve.length - 1);
  const pts = curve.map((v, i) => [i * step, 84 - ((v - lo) / span) * 74]);
  const line = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const last = pts[pts.length - 1];
  const grid = [10, 47, 84].map((y) =>
    `<line x1="0" y1="${y}" x2="320" y2="${y}" stroke="#d7dbe2" stroke-width="1"
       vector-effect="non-scaling-stroke"></line>`).join("");
  svg.innerHTML = `
    <defs><linearGradient id="wash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f4650" stop-opacity=".16"></stop>
      <stop offset="1" stop-color="#3f4650" stop-opacity="0"></stop>
    </linearGradient></defs>
    ${grid}
    <path d="${line} L320 92 L0 92 Z" fill="url(#wash)"></path>
    <path d="${line}" fill="none" stroke="#3f4650" stroke-width="2"
      stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"></path>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="4.5" fill="#3f4650"
      stroke="#e9ebef" stroke-width="2"></circle>
    <line id="cross" x1="0" y1="0" x2="0" y2="92" stroke="#3f4650" stroke-width="1"
      stroke-opacity="0" vector-effect="non-scaling-stroke"></line>`;
  $("range-hi").textContent = "$" + hi.toFixed(0);
  $("range-lo").textContent = "$" + lo.toFixed(0);
}

/* касание по графику показывает значение в этой точке */
function trackChart(event) {
  if (curve.length < 2) return;
  const well = $("well").getBoundingClientRect();
  const inner = Math.max(well.width - 24, 1);
  const x = Math.min(Math.max(event.clientX - well.left - 12, 0), inner);
  const idx = Math.min(Math.max(Math.round((x / inner) * (curve.length - 1)), 0), curve.length - 1);
  const bubble = $("bubble");
  bubble.textContent = "$" + curve[idx].toFixed(2);
  bubble.style.left = (x + 12) + "px";
  bubble.style.top = "30px";
  bubble.style.opacity = "1";
  const cross = document.getElementById("cross");
  if (cross) {
    const rel = (idx / (curve.length - 1)) * 320;
    cross.setAttribute("x1", rel);
    cross.setAttribute("x2", rel);
    cross.setAttribute("stroke-opacity", ".35");
  }
}
function untrackChart() {
  $("bubble").style.opacity = "0";
  const cross = document.getElementById("cross");
  if (cross) cross.setAttribute("stroke-opacity", "0");
}
$("well").addEventListener("pointermove", trackChart);
$("well").addEventListener("pointerdown", trackChart);
$("well").addEventListener("pointerleave", untrackChart);
$("well").addEventListener("pointerup", untrackChart);

function renderTape(rows) {
  if (!rows || !rows.length) {
    $("tape").innerHTML = `<span class="dim">ожидание данных рынка…</span>`;
    return;
  }
  const html = rows.map((t) => `<span>${t.held ? "◆ " : ""}<b>${esc(t.label)}</b>
    ${t.price.toFixed(2)} ${arrow(t.change)}${Math.abs(t.change * 100).toFixed(1)}c</span>`).join("");
  $("tape").innerHTML = html + html;      // дубль, чтобы лента шла без разрыва
}

function renderPositions(rows) {
  $("pos-count").textContent = rows.length + " / " + (state.limits.max_positions || "—");
  if (!rows.length) {
    $("positions").innerHTML = `<div class="empty">позиций нет — движок ждёт сигнал</div>`;
    return;
  }
  $("positions").innerHTML = `<table>
    <col class="c-name"><col class="c-mid"><col class="c-pnl">
    <thead><tr><th>РЫНОК</th><th class="num">ЦЕНА</th><th class="num">P&L</th></tr></thead>
    <tbody>${rows.map((p) => `<tr>
      <td>${esc(cut(p.question, 24))}
        <span class="sub-line"><span class="chip">${esc(cut(p.outcome, 5))}</span>
          ${esc(p.strategy)}</span></td>
      <td class="num">${p.mark.toFixed(3)}
        <span class="sub-line num">вход ${p.entry.toFixed(3)}</span></td>
      <td class="num ${cls(p.upnl)}">${money(p.upnl)}
        <span class="sub-line num">${short$(p.cost)}</span></td>
    </tr>`).join("")}</tbody>
  </table>`;
}

const LEVELS = {
  buy: ["ВХОД", "hi"], win: ["ПРОФИТ", "hi"], loss: ["УБЫТОК", ""],
  risk: ["РИСК", "hi"], scan: ["СКАН", ""], info: ["ИНФО", ""],
};

function renderLog(rows) {
  if (!rows.length) {
    $("log").innerHTML = `<div class="empty">лента пуста — движок только запустился</div>`;
    return;
  }
  $("log").innerHTML = rows.map((e) => {
    const [tag, mod] = LEVELS[e.level] || LEVELS.info;
    return `<div><span class="t">${hhmmss(e.ts)}</span>
      <span class="tag ${mod}">${tag}</span>${esc(e.text)}</div>`;
  }).join("");
}

function renderMetrics(s) {
  const dd = s.max_dd, cap = s.limits.max_drawdown || 20;
  const traded = s.strategies.filter((x) => x.trades).length;
  $("strategy-note").textContent = traded ? `торгуют ${traded} из ${s.strategies.length}` : "";
  $("metrics").innerHTML = `
    <div class="tiles four" style="margin-top:0">
      <div class="tile"><b>${s.win_rate.toFixed(0)}%</b><span>win rate</span></div>
      <div class="tile"><b>${s.profit_factor.toFixed(2)}</b><span>profit factor</span></div>
      <div class="tile"><b class="${cls(s.realized)}">${money(s.realized)}</b>
        <span>реализовано</span></div>
      <div class="tile"><b class="${cls(s.unrealized)}">${money(s.unrealized)}</b>
        <span>в позициях</span></div>
    </div>
    <div style="display:flex;justify-content:space-between;margin-top:16px;font-size:12px">
      <span class="dim">просадка</span>
      <b class="num">${dd.toFixed(1)}% из ${cap.toFixed(0)}%</b>
    </div>
    <div class="gauge"><i style="width:${Math.min(100, dd / cap * 100).toFixed(1)}%"></i></div>
    ${s.strategies.map((x) => `
      <div style="display:flex;justify-content:space-between;margin-top:10px;font-size:12px">
        <span class="dim">${esc(x.title)}</span>
        <span class="num ${cls(x.pnl)}">${money(x.pnl)}
          <span class="dim">· ${x.signals} сигн.</span></span>
      </div>`).join("")}`;
}

function render(s) {
  state = s;
  $("mode").textContent = "polybot · " + s.mode.toLowerCase();
  $("uptime").textContent = new Date().toTimeString().slice(0, 5) + (s.paused ? " · пауза" : "");
  $("equity").textContent = "$" + s.equity.toFixed(2);
  $("pnl").innerHTML = `<span class="${cls(s.pnl)}">${money(s.pnl)}
    (${arrow(s.pnl)}${Math.abs(s.pnl_pct).toFixed(2)}%)</span>
    <span class="dim">от $${s.bankroll.toFixed(0)}</span>`;
  $("day").textContent = money(s.day_pnl) || "$0.00";
  $("day").className = cls(s.day_pnl);
  $("cash").textContent = short$(s.cash);
  $("exposure").textContent = short$(s.exposure);
  $("cycles").textContent = "цикл " + s.cycles;
  $("status").textContent = s.status + " ";
  $("head-panel").className = "panel" + (s.blocked ? " alert" : "");
  $("pause").textContent = s.paused ? "Продолжить" : "Пауза";
  $("pause").classList.toggle("lit", !!s.paused);
  chart(s.equity_curve);
  renderTape(s.ticker);
  renderPositions(s.positions);
  renderLog(s.log);
  renderMetrics(s);
}

async function refresh() {
  try {
    render(await call("/api/state"));
  } catch (err) {
    $("status").textContent = "нет связи с движком: " + err.message + " ";
  }
}

async function act(action, extra) {
  if (busy) return;
  busy = true;
  document.querySelectorAll(".keys button").forEach((b) => (b.disabled = true));
  try {
    render(await call("/api/action", Object.assign({ action }, extra || {})));
    if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred("light");
  } catch (err) {
    $("status").textContent = "отказано: " + err.message + " ";
  } finally {
    busy = false;
    document.querySelectorAll(".keys button").forEach((b) => (b.disabled = false));
  }
}

function confirmThen(text, run) {
  if (tg && tg.showConfirm) tg.showConfirm(text, (ok) => ok && run());
  else if (confirm(text)) run();
}

$("refresh").onclick = refresh;
$("pause").onclick = () => act(state && state.paused ? "resume" : "pause");
$("flat").onclick = () => confirmThen("Закрыть все позиции по рынку?", () => act("flat"));
$("mode-btn").onclick = () => {
  const s = state;
  const text = !s ? "Данные ещё не загружены." :
    `Режим: ${s.mode === "LIVE" ? "боевой — ордера уходят на биржу" : "бумажный — деньги виртуальные"}
Банк: $${s.bankroll.toFixed(2)}, эквити $${s.equity.toFixed(2)}
Лимиты: риск ${s.limits.risk_per_trade.toFixed(1)}% на сделку, до ${s.limits.max_positions} позиций,
дневной стоп ${s.limits.daily_loss_limit.toFixed(0)}%, стоп по просадке ${s.limits.max_drawdown.toFixed(0)}%
Тейк +${(s.limits.take_profit * 100).toFixed(0)}c, стоп −${(s.limits.stop_loss * 100).toFixed(0)}c
Рынков в работе: ${s.markets}`;
