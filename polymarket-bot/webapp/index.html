<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>POLYBOT TERMINAL</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Светлая панель: белые карточки, воздух, синий как единственный акцент.
     Тяжёлых фасок и теней нет — вес даётся отступами и тонкими линиями. */
  :root {
    --bg:        #eef2f8;
    --card:      #ffffff;
    --line:      #e3e9f2;
    --line-soft: #eef2f7;
    --text:      #0f172a;
    --mid:       #55627a;
    --dim:       #8d9ab0;
    --blue:      #2563eb;
    --blue-ink:  #1d4ed8;
    --blue-soft: #eaf1ff;
    --blue-line: #cfe0ff;
    --up:        #0f9d63;
    --up-soft:   #e8f7f0;
    --down:      #dc4b4b;
    --down-soft: #fdeeee;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --shadow: 0 1px 2px rgba(16,24,40,.04), 0 6px 18px rgba(16,24,40,.06);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); }
  body {
    margin: 0; padding: 0 0 86px;
    color: var(--text); font-family: var(--sans);
    font-size: 13px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .num, .mono, table, .big, .tape { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  .pos { color: var(--up); } .neg { color: var(--down); } .zero { color: var(--dim); }
  .dim { color: var(--dim); } .mid { color: var(--mid); }
  .accent { color: var(--blue); }
  b, .strong { font-weight: 600; }

  /* --- бегущая строка -------------------------------------------------------- */
  .tape {
    position: sticky; top: 0; z-index: 6;
    background: var(--card); border-bottom: 1px solid var(--line);
    overflow: hidden; white-space: nowrap; padding: 7px 0; font-size: 11.5px;
    color: var(--mid);
  }
  .tape-inner { display: inline-block; padding-left: 10px; animation: scroll 44s linear infinite; }
  .tape span { margin-right: 20px; }
  .tape b { color: var(--blue); font-weight: 600; }
  @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  @media (prefers-reduced-motion: reduce) { .tape-inner { animation: none; } }

  /* --- карточки -------------------------------------------------------------- */
  .wrap { padding: 12px; display: grid; gap: 12px; }
  /* min-width:0 обязателен: иначе неразрывный текст внутри грида растягивает страницу */
  .wrap, .wrap > *, .cols > *, .panel, .body { min-width: 0; }
  .panel {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; box-shadow: var(--shadow);
  }
  .head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 11px 14px 9px;
    font-size: 11px; letter-spacing: .8px; color: var(--dim); text-transform: uppercase;
    font-weight: 600;
  }
  .body { padding: 0 14px 14px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  /* --- показания ------------------------------------------------------------- */
  .big { font-size: 30px; font-weight: 600; letter-spacing: -1px; color: var(--text); }
  .kv { display: flex; justify-content: space-between; gap: 10px; padding: 2px 0; min-width: 0; }
  .kv > * { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .kv span:first-child { color: var(--dim); }
  .kv b { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  .glass { margin-top: 12px; border-radius: 10px; background: var(--blue-soft); padding: 2px; }
  svg { display: block; width: 100%; height: 88px; }

  /* --- таблицы --------------------------------------------------------------- */
  /* фиксированная раскладка: колонки никогда не выталкивают страницу за экран */
  table { width: 100%; border-collapse: collapse; font-size: 11.5px; table-layout: fixed; }
  th {
    text-align: left; font-weight: 600; color: var(--dim); font-size: 10px;
    letter-spacing: .7px; padding: 0 6px 7px 0; border-bottom: 1px solid var(--line);
    font-family: var(--sans); text-transform: uppercase;
  }
  th, td { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  td { padding: 7px 6px 7px 0; border-bottom: 1px solid var(--line-soft); }
  tbody tr:last-child td { border-bottom: 0; }
  /* ИСХ шире, чем кажется нужным: узкая колонка обрезала шильду многоточием */
  col.c-q { width: 28%; } col.c-tag { width: 13%; } col.c-num { width: 14%; }
  col.c-pnl { width: 17%; } col.c-time { width: 13%; } col.c-side { width: 10%; }
  /* третья стратегия в двухколоночной сетке занимает всю ширину, а не половину */
  .cols > .panel:last-child:nth-child(odd) { grid-column: 1 / -1; }
  .num { text-align: right; }

  .chip {
    display: inline-block; padding: 1px 6px; border-radius: 999px; font-size: 10.5px;
    font-family: var(--sans); font-weight: 600;
    color: var(--blue-ink); background: var(--blue-soft); border: 1px solid var(--blue-line);
  }

  /* --- лента событий --------------------------------------------------------- */
  .log { max-height: 210px; overflow-y: auto; margin-right: -4px; padding-right: 4px; }
  .log div { padding: 3px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
             color: var(--mid); border-bottom: 1px solid var(--line-soft); }
  .log div:last-child { border-bottom: 0; }
  .log .t { color: var(--dim); margin-right: 8px; font-family: var(--mono); font-size: 11px; }
  .tag {
    display: inline-block; min-width: 64px; text-align: center; font-size: 10px;
    font-weight: 600; letter-spacing: .4px; padding: 1px 6px; margin-right: 8px;
    border-radius: 999px; color: var(--blue-ink);
    background: var(--blue-soft); border: 1px solid var(--blue-line);
  }
  .tag.hi { color: var(--up); background: var(--up-soft); border-color: #c9ecdc; }
  .tag.lo { color: var(--dim); background: #f3f5f9; border-color: var(--line); }
  .tag.bad { color: var(--down); background: var(--down-soft); border-color: #f6d4d4; }

  .empty { color: var(--dim); padding: 8px 0; }

  .gauge { height: 6px; border-radius: 999px; margin-top: 8px;
           background: #edf1f7; overflow: hidden; }
  .gauge > i { display: block; height: 100%; border-radius: 999px; background: var(--blue); }

  /* --- кнопки ---------------------------------------------------------------- */
  .keys {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 8;
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    background: rgba(238,242,248,.92); backdrop-filter: blur(8px);
    border-top: 1px solid var(--line);
  }
  .keys button {
    border: 1px solid var(--line); border-radius: 10px; cursor: pointer;
    font-family: var(--sans); font-size: 12px; font-weight: 600; padding: 11px 4px;
    color: var(--mid); background: var(--card);
    box-shadow: 0 1px 2px rgba(16,24,40,.05);
    transition: background .12s, color .12s, transform .06s;
  }
  .keys button:active { transform: scale(.97); background: #f5f8fd; }
  .keys button:disabled { color: #b8c2d4; }
  .keys .primary { color: #fff; background: var(--blue); border-color: var(--blue); }
  .keys .lit { color: var(--blue-ink); background: var(--blue-soft); border-color: var(--blue-line); }

  .cursor::after { content: "▌"; color: var(--blue); animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .alert { border-color: #f6c9c9; box-shadow: 0 0 0 3px var(--down-soft); }
</style>
</head>
<body>

<div class="tape"><div class="tape-inner" id="tape"></div></div>

<div class="wrap">

  <div class="panel" id="head-panel">
    <div class="head">
      <span>polybot · <span id="mode">paper</span></span>
      <span id="uptime"></span>
    </div>
    <div class="body">
      <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:10px">
        <div style="min-width:0">
          <div class="big" id="equity">$0.00</div>
          <div id="pnl" class="dim">—</div>
        </div>
        <div style="text-align:right;min-width:40%">
          <div class="kv"><span>сегодня</span><b id="day">—</b></div>
          <div class="kv"><span>кэш</span><b id="cash">—</b></div>
          <div class="kv"><span>в рынке</span><b id="exposure">—</b></div>
        </div>
      </div>
      <div class="glass"><svg id="chart" viewBox="0 0 320 88" preserveAspectRatio="none"></svg></div>
      <div class="kv" style="margin-top:8px">
        <span id="status" class="dim cursor"></span>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="head"><span>позиции</span><span id="pos-count"></span></div>
    <div class="body" id="positions"></div>
  </div>

  <div class="cols" id="strategies"></div>

  <div class="panel">
    <div class="head"><span>исполнения</span><span>последние</span></div>
    <div class="body" id="fills"></div>
  </div>

  <div class="panel">
    <div class="head"><span>лента движка</span><span id="cycles"></span></div>
    <div class="body log" id="log"></div>
  </div>

  <div class="panel">
    <div class="head"><span>метрики</span><span>риск</span></div>
    <div class="body" id="metrics"></div>
  </div>

</div>

<div class="keys">
  <button id="refresh" class="primary">Обновить</button>
  <button id="pause">Пауза</button>
  <button id="flat">Закрыть всё</button>
  <button id="mode-btn">Инфо</button>
</div>

<script>
const tg = window.Telegram ? window.Telegram.WebApp : null;
if (tg) {
  tg.ready(); tg.expand();
  try { tg.setHeaderColor("#ffffff"); tg.setBackgroundColor("#eef2f8"); } catch (e) {}
}
const initData = tg ? tg.initData : "";
let state = null, busy = false;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// монохром: направление показывают стрелка и яркость, а не цвет
const arrow = (v) => (v > 0 ? "▲" : v < 0 ? "▼" : "");
const cls = (v) => (v > 0 ? "pos" : v < 0 ? "neg" : "zero");
const money = (v) => arrow(v) + "$" + Math.abs(v).toFixed(2);
const short$ = (v) => "$" + Math.round(Math.abs(v)).toLocaleString("en-US");
const hhmmss = (ts) => new Date(ts * 1000).toTimeString().slice(0, 8);
const cut = (s, n) => (s.length > n ? s.slice(0, n - 1) + "…" : s);

async function call(path, extra) {
  const res = await fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(Object.assign({ initData }, extra || {})),
  });
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.error || "HTTP " + res.status);
  }
  return res.json();
}

function chart(values) {
  const svg = $("chart");
  if (!values || values.length < 2) { svg.innerHTML = ""; return; }
  const lo = Math.min(...values), hi = Math.max(...values), span = (hi - lo) || 1;
  const step = 320 / (values.length - 1);
  const pts = values.map((v, i) => [i * step, 82 - ((v - lo) / span) * 72]);
  const line = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const last = pts[pts.length - 1];
  const grid = [22, 44, 66].map((y) =>
    `<line x1="0" y1="${y}" x2="320" y2="${y}" stroke="#2563eb" stroke-opacity=".08"></line>`).join("");
  svg.innerHTML = `
    <defs>
      <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#2563eb" stop-opacity=".22"></stop>
        <stop offset="1" stop-color="#2563eb" stop-opacity="0"></stop>
      </linearGradient>
    </defs>
    ${grid}
    <path d="${line} L320 88 L0 88 Z" fill="url(#fade)"></path>
    <path d="${line}" fill="none" stroke="#2563eb" stroke-width="2"
      vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"></path>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3" fill="#2563eb"
      stroke="#fff" stroke-width="2"></circle>`;
}

function renderTape(rows) {
  if (!rows || !rows.length) {
    $("tape").innerHTML = `<span class="dim">ожидание данных рынка…</span>`;
    return;
  }
  const html = rows.map((t) => `<span>${t.held ? "◆ " : ""}<b>${esc(t.label)}</b>
    ${t.price.toFixed(2)} <span class="${cls(t.change)}">${arrow(t.change)}${
      Math.abs(t.change * 100).toFixed(1)}c</span></span>`).join("");
  $("tape").innerHTML = html + html;      // дубль, чтобы лента шла без разрыва
}

function renderPositions(rows) {
  $("pos-count").textContent = rows.length + " / " + (state.limits.max_positions || "—");
  if (!rows.length) {
    $("positions").innerHTML = `<div class="empty">нет открытых позиций — движок ждёт сигнал</div>`;
    return;
  }
  $("positions").innerHTML = `<table>
    <col class="c-q"><col class="c-tag"><col class="c-num"><col class="c-num">
    <col class="c-num"><col class="c-pnl">
    <thead><tr><th>РЫНОК</th><th>ИСХ</th><th class="num">ВХОД</th><th class="num">ЦЕНА</th>
      <th class="num">СУММА</th><th class="num">P&L</th></tr></thead>
    <tbody>${rows.map((p) => `<tr>
      <td>${esc(cut(p.question, 40))}</td>
      <td><span class="chip">${esc(cut(p.outcome, 5))}</span></td>
      <td class="num dim">${p.entry.toFixed(3)}</td>
      <td class="num ${cls(p.mark - p.entry)}">${p.mark.toFixed(3)}</td>
      <td class="num dim">${short$(p.cost)}</td>
      <td class="num ${cls(p.upnl)}">${money(p.upnl)}</td>
    </tr>`).join("")}</tbody>
  </table>`;
}

function renderStrategies(rows) {
  $("strategies").innerHTML = rows.map((s) => `
    <div class="panel">
      <div class="head"><span>${esc(s.title)}</span>
        <span class="${cls(s.pnl)}">${money(s.pnl)}</span></div>
      <div class="body">
        <div class="kv"><span>сигналов</span><b>${s.signals}</b></div>
        <div class="kv"><span>сделок</span><b>${s.trades}</b></div>
        ${s.notes.length
          ? s.notes.map((n) => `<div class="dim" style="overflow:hidden;text-overflow:ellipsis;
              white-space:nowrap">${esc(n)}</div>`).join("")
          : `<div class="empty">тихо</div>`}
      </div>
    </div>`).join("");
}

function renderFills(rows) {
  if (!rows.length) {
    $("fills").innerHTML = `<div class="empty">сделок пока не было</div>`;
    return;
  }
  $("fills").innerHTML = `<table>
    <col class="c-time"><col class="c-side"><col class="c-q"><col class="c-num">
    <col class="c-num"><col class="c-pnl">
    <thead><tr><th>ВРЕМЯ</th><th>СТОР</th><th>РЫНОК</th><th class="num">ОБЪЁМ</th>
      <th class="num">ЦЕНА</th><th class="num">P&L</th></tr></thead>
    <tbody>${rows.slice(0, 14).map((f) => `<tr>
      <td class="dim">${hhmmss(f.ts).slice(0, 5)}</td>
      <td class="${f.side === "BUY" ? "accent" : "mid"}">${f.side}</td>
      <td>${esc(cut(f.question, 34))}</td>
      <td class="num dim">${f.size.toFixed(0)}</td>
      <td class="num mid">${f.price.toFixed(3)}</td>
      <td class="num ${f.pnl ? cls(f.pnl) : "dim"}">${f.pnl ? money(f.pnl) : "—"}</td>
    </tr>`).join("")}</tbody>
  </table>`;
}

const LEVELS = {
  buy:  ["ВХОД", ""], win: ["ПРОФИТ", "hi"], loss: ["УБЫТОК", "bad"],
  risk: ["РИСК", "bad"], scan: ["СКАН", "lo"], info: ["ИНФО", "lo"],
};

function renderLog(rows) {
  if (!rows.length) {
    $("log").innerHTML = `<div class="empty">лента пуста — движок только запустился</div>`;
    return;
  }
  $("log").innerHTML = rows.map((e) => {
    const [tag, mod] = LEVELS[e.level] || LEVELS.info;
    return `<div><span class="t">${hhmmss(e.ts)}</span>
      <span class="tag ${mod}">${tag}</span>${esc(e.text)}</div>`;
  }).join("");
}

function renderMetrics(s) {
  const dd = s.max_dd, ddCap = s.limits.max_drawdown || 20;
  $("metrics").innerHTML = `
    <div class="cols" style="gap:2px 16px">
      <div class="kv"><span>win rate</span><b>${s.win_rate.toFixed(0)}%</b></div>
      <div class="kv"><span>profit factor</span><b>${s.profit_factor.toFixed(2)}</b></div>
      <div class="kv"><span>реализовано</span>
        <b class="${cls(s.realized)}">${money(s.realized)}</b></div>
      <div class="kv"><span>плавающий</span>
        <b class="${cls(s.unrealized)}">${money(s.unrealized)}</b></div>
      <div class="kv"><span>sharpe</span><b>${s.sharpe.toFixed(2)}</b></div>
      <div class="kv"><span>рынков</span><b>${s.markets}</b></div>
    </div>
    <div class="kv" style="margin-top:10px"><span>просадка</span>
      <b>${dd.toFixed(1)}% из ${ddCap.toFixed(0)}%</b></div>
    <div class="gauge"><i style="width:${Math.min(100, dd / ddCap * 100).toFixed(1)}%"></i></div>
    <div class="kv" style="margin-top:10px"><span>риск на сделку</span>
      <b>${s.limits.risk_per_trade.toFixed(1)}%</b></div>
    <div class="kv"><span>тейк / стоп</span>
      <b>+${(s.limits.take_profit * 100).toFixed(0)}c / −${
        (s.limits.stop_loss * 100).toFixed(0)}c</b></div>`;
}

function render(s) {
  state = s;
  $("mode").textContent = s.mode.toLowerCase();
  $("mode").className = s.mode === "LIVE" ? "pos" : "mid";
  $("equity").textContent = "$" + s.equity.toFixed(2);
  $("pnl").innerHTML = `<span class="${cls(s.pnl)}">${money(s.pnl)}
    (${arrow(s.pnl)}${Math.abs(s.pnl_pct).toFixed(2)}%)</span>
    <span class="dim">от $${s.bankroll.toFixed(0)}</span>`;
  $("day").innerHTML = `<span class="${cls(s.day_pnl)}">${money(s.day_pnl)}</span>`;
  $("cash").textContent = short$(s.cash);
  $("exposure").textContent = short$(s.exposure);
  $("cycles").textContent = "цикл " + s.cycles;
  $("uptime").textContent = new Date().toTimeString().slice(0, 5) + (s.paused ? " · пауза" : "");
  $("status").textContent = s.status + " ";
  $("head-panel").className = "panel" + (s.blocked ? " alert" : "");
  $("pause").textContent = s.paused ? "Продолжить" : "Пауза";
  $("pause").classList.toggle("lit", !!s.paused);
  chart(s.equity_curve);
  renderTape(s.ticker);
  renderPositions(s.positions);
  renderStrategies(s.strategies);
  renderFills(s.fills);
  renderLog(s.log);
  renderMetrics(s);
}

async function refresh() {
  try {
    render(await call("/api/state"));
  } catch (err) {
    $("status").textContent = "нет связи с движком: " + err.message + " ";
  }
}

async function act(action, extra) {
  if (busy) return;
  busy = true;
  document.querySelectorAll(".keys button").forEach((b) => (b.disabled = true));
  try {
    render(await call("/api/action", Object.assign({ action }, extra || {})));
    if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred("light");
  } catch (err) {
    $("status").textContent = "отказано: " + err.message + " ";
  } finally {
    busy = false;
    document.querySelectorAll(".keys button").forEach((b) => (b.disabled = false));
  }
}

function confirmThen(text, run) {
  if (tg && tg.showConfirm) tg.showConfirm(text, (ok) => ok && run());
  else if (confirm(text)) run();
}

$("refresh").onclick = refresh;
$("pause").onclick = () => act(state && state.paused ? "resume" : "pause");
$("flat").onclick = () => confirmThen("Закрыть все позиции по рынку?", () => act("flat"));
$("mode-btn").onclick = () => {
  const s = state;
  const text = !s ? "Данные ещё не загружены." :
    `Режим: ${s.mode === "LIVE" ? "боевой — ордера уходят на биржу" : "бумажный — деньги виртуальные"}
Банк: $${s.bankroll.toFixed(2)}, эквити $${s.equity.toFixed(2)}
Лимиты: риск ${s.limits.risk_per_trade.toFixed(1)}% на сделку, до ${s.limits.max_positions} позиций,
дневной стоп ${s.limits.daily_loss_limit.toFixed(0)}%, стоп по просадке ${s.limits.max_drawdown.toFixed(0)}%
Тейк +${(s.limits.take_profit * 100).toFixed(0)}c, стоп −${(s.limits.stop_loss * 100).toFixed(0)}c`;
  if (tg && tg.showPopup) tg.showPopup({ title: "POLYBOT", message: text });
  else alert(text);
};

document.addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  if (k === "r") refresh();
  if (k === "p") $("pause").click();
  if (k === "f") $("flat").click();
});

refresh();
setInterval(refresh, 3000);
</script>
</body>
