<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Polybot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Прибор, а не документ: чёрный графитовый корпус, выпуклые карточки и клавиши,
     утопленные экраны. Цвета нет — направление несут стрелки ▲▼ и вес шрифта.
     На тёмном ролью света и тени меняются местами: блик сверху тонкий и белый,
     тень снизу глубокая. Контраст текста к карточке: 14.6:1 / 7.6:1 / 5.3:1,
     линия графика к экрану 15:1. */
  :root {
    --ground:   #0e1013;
    --panel-hi: #24282f;
    --panel:    #1b1f25;
    --well:     #0b0d10;
    --edge:     #2b313a;
    --ink:      #eef1f5;
    --mid:      #a7b0bd;
    --dim:      #8a93a1;
    --mark:     #dfe4ea;
    --sans: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --raise: 0 1px 0 rgba(255,255,255,.09) inset, 0 -2px 0 rgba(0,0,0,.5) inset,
             0 2px 4px rgba(0,0,0,.45), 0 14px 30px rgba(0,0,0,.55);
    --press: inset 0 3px 8px rgba(0,0,0,.75), inset 0 -1px 0 rgba(255,255,255,.06);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--ground); }
  body {
    margin: 0; padding: 0 0 92px; color: var(--ink); font-family: var(--sans);
    font-size: 13.5px; line-height: 1.55; font-weight: 500;
    -webkit-font-smoothing: antialiased;
    background: radial-gradient(150% 75% at 50% -5%, #23272e 0%, #14171b 55%, #0b0d10 100%);
    background-attachment: fixed;
  }
  .num, table, .big, .tape, .tile b { font-family: var(--mono);
                                      font-variant-numeric: tabular-nums; }
  .dim { color: var(--dim); }
  .up { color: var(--ink); font-weight: 600; }
  .down { color: var(--mid); }
  :focus-visible { outline: 2px solid var(--mark); outline-offset: 2px; }

  /* --- бегущая строка: узкая прорезь в корпусе -------------------------------- */
  .tape {
    position: sticky; top: 0; z-index: 6; overflow: hidden; white-space: nowrap;
    padding: 6px 0; font-size: 10.5px; color: var(--mid);
    background: var(--well); box-shadow: var(--press);
  }
  .tape-inner { display: inline-block; padding-left: 14px; animation: scroll 48s linear infinite; }
  .tape span { margin-right: 24px; }
  .tape b { color: var(--ink); font-weight: 500; }
  @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  @media (prefers-reduced-motion: reduce) { .tape-inner { animation: none; } }

  /* --- корпус ----------------------------------------------------------------- */
  .wrap { padding: 14px; display: grid; gap: 14px; }
  /* min-width:0 обязателен: иначе неразрывный текст внутри грида растягивает страницу */
  .wrap, .wrap > *, .panel, .body, .tile { min-width: 0; }
  .panel {
    border-radius: 18px; box-shadow: var(--raise);
    background: linear-gradient(180deg, var(--panel-hi), var(--panel));
  }
  .head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 13px 16px 6px; font-size: 10px; font-weight: 700;
    letter-spacing: 1.4px; text-transform: uppercase; color: var(--dim);
  }
  .body { padding: 0 16px 16px; }

  .big { font-size: 37px; font-weight: 700; letter-spacing: -1.6px; line-height: 1.05; }
  .sub { margin-top: 3px; color: var(--mid); font-size: 12.5px; }

  /* утопленный экран графика */
  .well { position: relative; margin-top: 16px; border-radius: 14px;
          background: var(--well); box-shadow: var(--press); padding: 12px 14px 10px; }
  svg { display: block; width: 100%; height: 96px; overflow: visible; }
  .range { position: absolute; right: 14px; font-size: 9.5px; color: var(--mid);
           font-family: var(--mono); }
  .range.hi { top: 9px; } .range.lo { bottom: 7px; }
  .bubble {
    position: absolute; transform: translate(-50%, -100%); pointer-events: none;
    background: var(--ink); color: #14171b; font-family: var(--mono); font-size: 10.5px;
    padding: 4px 8px; border-radius: 8px; white-space: nowrap; opacity: 0;
    transition: opacity .12s;
  }

  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
  .tiles.pair { grid-template-columns: repeat(2, 1fr); margin-top: 0; }
  .tile {
    border-radius: 13px; padding: 11px 12px;
    background: linear-gradient(180deg, #262b32, var(--panel));
    box-shadow: 0 1px 0 rgba(255,255,255,.08) inset, 0 -1px 0 rgba(0,0,0,.5) inset,
                0 4px 9px rgba(0,0,0,.45);
  }
  .tile b { display: block; font-size: 17px; font-weight: 600; letter-spacing: -.5px; }
  .tile span { font-size: 10px; color: var(--dim); letter-spacing: .2px; }

  /* --- позиции ---------------------------------------------------------------- */
  .pos { display: flex; justify-content: space-between; gap: 12px; align-items: baseline;
         padding: 11px 0; border-bottom: 1px solid var(--edge); }
  .pos:last-child { border-bottom: 0; padding-bottom: 0; }
  .pos-name { min-width: 0; }
  .pos-name > b { display: block; font-weight: 600; font-size: 13px;
                  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pos-name > span { font-size: 10.5px; color: var(--dim); }
  .pos-val { text-align: right; white-space: nowrap; font-family: var(--mono); }
  .pos-val > b { display: block; font-size: 13.5px; }
  .pos-val > span { font-size: 10.5px; color: var(--dim); }
  .chip {
    display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 9.5px;
    font-weight: 600; color: var(--mid); margin-right: 6px; font-family: var(--sans);
    background: linear-gradient(180deg, #2a2f37, #1e2229);
    box-shadow: 0 1px 0 rgba(255,255,255,.09) inset, 0 2px 3px rgba(0,0,0,.5);
  }

  /* --- переключатель ---------------------------------------------------------- */
  .switch { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px;
            margin: 0 16px 12px; border-radius: 12px;
            background: var(--well); box-shadow: var(--press); }
  .switch button {
    border: 0; border-radius: 9px; padding: 8px 4px; cursor: pointer;
    font-family: var(--sans); font-size: 11px; font-weight: 600; letter-spacing: .5px;
    text-transform: uppercase; color: var(--mid); background: transparent;
  }
  .switch button[aria-selected="true"] {
    color: var(--ink);
    background: linear-gradient(180deg, #2a2f37, var(--panel));
    box-shadow: 0 1px 0 rgba(255,255,255,.1) inset, 0 3px 6px rgba(0,0,0,.5);
  }

  .log { max-height: 236px; overflow-y: auto; }
  .log div { padding: 7px 0; border-bottom: 1px solid var(--edge); color: var(--mid);
             white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .log div:last-child { border-bottom: 0; }
  .log .t { font-family: var(--mono); font-size: 10px; color: var(--dim); margin-right: 8px; }
  .tag {
    display: inline-block; min-width: 58px; text-align: center; font-size: 9px;
    font-weight: 600; letter-spacing: .5px; padding: 2px 6px; margin-right: 8px;
    border-radius: 999px; color: var(--mid);
    background: linear-gradient(180deg, #2a2f37, #1e2229);
    box-shadow: 0 1px 0 rgba(255,255,255,.09) inset, 0 2px 3px rgba(0,0,0,.5);
  }
  .tag.hi { color: var(--ink); }
  .empty { color: var(--dim); padding: 12px 0; }

  .row { display: flex; justify-content: space-between; margin-top: 14px; font-size: 12px; }
  .gauge { height: 9px; border-radius: 999px; margin-top: 9px;
           background: var(--well); box-shadow: var(--press); overflow: hidden; }
  .gauge > i { display: block; height: 100%; border-radius: 999px;
               background: linear-gradient(180deg, var(--mark), #98a1ae); }

  /* --- клавиши ---------------------------------------------------------------- */
  .keys {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 8;
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
    padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
    background: linear-gradient(180deg, rgba(14,16,19,.35), var(--ground) 55%);
    backdrop-filter: blur(10px);
  }
  .keys button {
    border: 0; border-radius: 14px; cursor: pointer; padding: 14px 4px;
    font-family: var(--sans); font-size: 13px; font-weight: 700; color: var(--mid);
    background: linear-gradient(180deg, #2b3038, #1d2128);
    box-shadow: 0 1px 0 rgba(255,255,255,.1) inset, 0 4px 0 #0a0c0f,
                0 10px 18px rgba(0,0,0,.6);
    transition: transform .06s, box-shadow .06s;
  }
  .keys button:active { transform: translateY(4px); box-shadow: var(--press); }
  .keys button:disabled { color: #565e6a; }
  .keys .lit { color: var(--ink); box-shadow: var(--press); }
  @media (prefers-reduced-motion: reduce) { .keys button { transition: none; } }

  .cursor::after { content: "▌"; color: var(--dim); animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .alert { box-shadow: var(--raise), 0 0 0 2px rgba(238,241,245,.45); }
</style>
</head>
<body data-palette="#dfe4ea">

<div class="tape"><div class="tape-inner" id="tape"></div></div>

<div class="wrap">

  <div class="panel" id="head-panel">
    <div class="head">
      <span id="mode">polybot · paper</span>
      <span id="uptime"></span>
    </div>
    <div class="body">
      <div class="big" id="equity">$0.00</div>
      <div class="sub" id="pnl">—</div>

      <div class="well" id="well">
        <span class="range hi" id="range-hi"></span>
        <span class="range lo" id="range-lo"></span>
        <svg id="chart" viewBox="0 0 320 96" preserveAspectRatio="none"></svg>
        <div class="bubble" id="bubble"></div>
      </div>

      <div class="tiles">
        <div class="tile"><b id="day">—</b><span>сегодня</span></div>
        <div class="tile"><b id="cash">—</b><span>свободно</span></div>
        <div class="tile"><b id="exposure">—</b><span>в рынке</span></div>
      </div>

      <div class="sub dim cursor" id="status" style="margin-top:14px"></div>
    </div>
  </div>

  <div class="panel">
    <div class="head"><span>позиции</span><span id="pos-count"></span></div>
    <div class="body" id="positions"></div>
  </div>

  <div class="panel">
    <div class="head" style="justify-content:flex-end"><span id="cycles"></span></div>
    <div class="switch" role="tablist">
      <button role="tab" id="tab-log" aria-selected="true">лента</button>
      <button role="tab" id="tab-stats" aria-selected="false">метрики</button>
    </div>
    <div class="body log" id="log"></div>
    <div class="body" id="metrics" hidden></div>
  </div>

</div>

<div class="keys">
  <button id="refresh">Обновить</button>
  <button id="pause">Пауза</button>
  <button id="flat">Закрыть всё</button>
</div>

<script>
const tg = window.Telegram ? window.Telegram.WebApp : null;
if (tg) {
  tg.ready(); tg.expand();
  try { tg.setHeaderColor("#0e1013"); tg.setBackgroundColor("#0e1013"); } catch (e) {}
}
const initData = tg ? tg.initData : "";
let state = null, busy = false, curve = [], tab = "log";

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// монохром: направление несут стрелка и насыщенность текста, не цвет
const arrow = (v) => (v > 0 ? "▲" : v < 0 ? "▼" : "");
const cls = (v) => (v > 0 ? "up" : v < 0 ? "down" : "dim");
const money = (v) => arrow(v) + "$" + Math.abs(v).toFixed(2);
const short$ = (v) => "$" + Math.round(Math.abs(v)).toLocaleString("en-US");
const hhmm = (ts) => new Date(ts * 1000).toTimeString().slice(0, 5);
const cut = (s, n) => (s.length > n ? s.slice(0, n - 1) + "…" : s);

async function call(path, extra) {
  const res = await fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(Object.assign({ initData }, extra || {})),
  });
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.error || "HTTP " + res.status);
  }
  return res.json();
}

/* --- график: одна серия, поэтому без легенды; крайние значения подписаны ----- */
function chart(values) {
  const svg = $("chart");
  curve = values || [];
  if (curve.length < 2) { svg.innerHTML = ""; return; }
  const lo = Math.min(...curve), hi = Math.max(...curve), span = (hi - lo) || 1;
  const step = 320 / (curve.length - 1);
  const pts = curve.map((v, i) => [i * step, 88 - ((v - lo) / span) * 78]);
  const line = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const last = pts[pts.length - 1];
  const grid = [10, 49, 88].map((y) =>
    `<line x1="0" y1="${y}" x2="320" y2="${y}" stroke="#2b313a" stroke-width="1"
       vector-effect="non-scaling-stroke"></line>`).join("");
  svg.innerHTML = `
    <defs><linearGradient id="wash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dfe4ea" stop-opacity=".18"></stop>
      <stop offset="1" stop-color="#dfe4ea" stop-opacity="0"></stop>
    </linearGradient></defs>
    ${grid}
    <path d="${line} L320 96 L0 96 Z" fill="url(#wash)"></path>
    <path d="${line}" fill="none" stroke="#dfe4ea" stroke-width="2"
      stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"></path>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="4.5" fill="#dfe4ea"
      stroke="#0b0d10" stroke-width="2"></circle>
    <line id="cross" x1="0" y1="0" x2="0" y2="96" stroke="#dfe4ea" stroke-width="1"
      stroke-opacity="0" vector-effect="non-scaling-stroke"></line>`;
  $("range-hi").textContent = "$" + hi.toFixed(0);
  $("range-lo").textContent = "$" + lo.toFixed(0);
}

/* касание по графику показывает значение в этой точке */
function trackChart(event) {
  if (curve.length < 2) return;
  const box = $("well").getBoundingClientRect();
  const inner = Math.max(box.width - 28, 1);
  const x = Math.min(Math.max(event.clientX - box.left - 14, 0), inner);
  const idx = Math.min(Math.max(Math.round((x / inner) * (curve.length - 1)), 0), curve.length - 1);
  const bubble = $("bubble");
  bubble.textContent = "$" + curve[idx].toFixed(2);
  bubble.style.left = (x + 14) + "px";
  bubble.style.top = "34px";
  bubble.style.opacity = "1";
  const cross = document.getElementById("cross");
  if (cross) {
    const rel = (idx / (curve.length - 1)) * 320;
    cross.setAttribute("x1", rel);
    cross.setAttribute("x2", rel);
    cross.setAttribute("stroke-opacity", ".4");
  }
}
function untrackChart() {
  $("bubble").style.opacity = "0";
  const cross = document.getElementById("cross");
  if (cross) cross.setAttribute("stroke-opacity", "0");
}
["pointermove", "pointerdown"].forEach((e) => $("well").addEventListener(e, trackChart));
["pointerleave", "pointerup"].forEach((e) => $("well").addEventListener(e, untrackChart));

function renderTape(rows) {
  if (!rows || !rows.length) {
    $("tape").innerHTML = `<span class="dim">ожидание данных рынка…</span>`;
    return;
  }
  const html = rows.map((t) => `<span>${t.held ? "◆ " : ""}<b>${esc(t.label)}</b>
    ${t.price.toFixed(2)} ${arrow(t.change)}${Math.abs(t.change * 100).toFixed(1)}c</span>`).join("");
  $("tape").innerHTML = html + html;      // дубль, чтобы лента шла без разрыва
}

function renderPositions(rows) {
  $("pos-count").textContent = rows.length + " / " + (state.limits.max_positions || "—");
  if (!rows.length) {
    $("positions").innerHTML = `<div class="empty">позиций нет — движок ждёт сигнал</div>`;
    return;
  }
  $("positions").innerHTML = rows.slice(0, 6).map((p) => `
    <div class="pos">
      <span class="pos-name">
        <b>${esc(cut(p.question, 30))}</b>
        <span><span class="chip">${esc(cut(p.outcome, 5))}</span>${p.entry.toFixed(3)} →
          ${p.mark.toFixed(3)}</span>
      </span>
      <span class="pos-val">
        <b class="${cls(p.upnl)}">${money(p.upnl)}</b>
        <span>${short$(p.cost)}</span>
      </span>
    </div>`).join("");
}

const LEVELS = {
  buy: ["ВХОД", "hi"], win: ["ПРОФИТ", "hi"], loss: ["УБЫТОК", ""],
  risk: ["РИСК", "hi"], scan: ["СКАН", ""], info: ["ИНФО", ""],
};

function renderLog(rows) {
  if (!rows.length) {
    $("log").innerHTML = `<div class="empty">лента пуста — движок только запустился</div>`;
    return;
  }
  $("log").innerHTML = rows.map((e) => {
    const [tag, mod] = LEVELS[e.level] || LEVELS.info;
    return `<div><span class="t">${hhmm(e.ts)}</span>
      <span class="tag ${mod}">${tag}</span>${esc(e.text)}</div>`;
  }).join("");
}

function renderMetrics(s) {
  const dd = s.max_dd, cap = s.limits.max_drawdown || 20;
  $("metrics").innerHTML = `
    <div class="tiles pair">
      <div class="tile"><b>${s.win_rate.toFixed(0)}%</b><span>win rate</span></div>
      <div class="tile"><b>${s.profit_factor.toFixed(2)}</b><span>profit factor</span></div>
      <div class="tile"><b class="${cls(s.realized)}">${money(s.realized)}</b>
        <span>реализовано</span></div>
      <div class="tile"><b class="${cls(s.unrealized)}">${money(s.unrealized)}</b>
        <span>в позициях</span></div>
    </div>
    <div class="row"><span class="dim">просадка</span>
      <b class="num">${dd.toFixed(1)}% из ${cap.toFixed(0)}%</b></div>
    <div class="gauge"><i style="width:${Math.min(100, dd / cap * 100).toFixed(1)}%"></i></div>
    ${s.strategies.map((x) => `
      <div class="row"><span class="dim">${esc(x.title)}</span>
        <span class="num ${cls(x.pnl)}">${money(x.pnl)}
          <span class="dim">· ${x.signals} сигн.</span></span></div>`).join("")}`;
}

function showTab(which) {
  tab = which;
  const isLog = which === "log";
  $("log").hidden = !isLog;
  $("metrics").hidden = isLog;
  $("tab-log").setAttribute("aria-selected", String(isLog));
  $("tab-stats").setAttribute("aria-selected", String(!isLog));
  if (state) {
    const traded = state.strategies.filter((x) => x.trades).length;
    $("cycles").textContent = isLog
      ? "цикл " + state.cycles
      : `торгуют ${traded} из ${state.strategies.length}`;
  }
}
$("tab-log").onclick = () => showTab("log");
$("tab-stats").onclick = () => showTab("stats");

function render(s) {
  state = s;
  $("mode").textContent = "polybot · " + s.mode.toLowerCase();
  $("uptime").textContent = new Date().toTimeString().slice(0, 5) + (s.paused ? " · пауза" : "");
  $("equity").textContent = "$" + s.equity.toFixed(2);
  $("pnl").innerHTML = `<span class="${cls(s.pnl)}">${money(s.pnl)}
    (${arrow(s.pnl)}${Math.abs(s.pnl_pct).toFixed(2)}%)</span>
    <span class="dim">от $${s.bankroll.toFixed(0)}</span>`;
  $("day").textContent = money(s.day_pnl) || "$0.00";
  $("day").className = cls(s.day_pnl);
  $("cash").textContent = short$(s.cash);
  $("exposure").textContent = short$(s.exposure);
  $("status").textContent = s.status + " ";
  $("head-panel").className = "panel" + (s.blocked ? " alert" : "");
  $("pause").textContent = s.paused ? "Продолжить" : "Пауза";
  $("pause").classList.toggle("lit", !!s.paused);
  chart(s.equity_curve);
  renderTape(s.ticker);
  renderPositions(s.positions);
  renderLog(s.log);
  renderMetrics(s);
  showTab(tab);
}

async function refresh() {
  try {
    render(await call("/api/state"));
  } catch (err) {
    $("status").textContent = "нет связи с движком: " + err.message + " ";
  }
}

async function act(action, extra) {
  if (busy) return;
  busy = true;
  document.querySelectorAll(".keys button").forEach((b) => (b.disabled = true));
  try {
    render(await call("/api/action", Object.assign({ action }, extra || {})));
    if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred("light");
  } catch (err) {
    $("status").textContent = "отказано: " + err.message + " ";
  } finally {
    busy = false;
    document.querySelectorAll(".keys button").forEach((b) => (b.disabled = false));
  }
}

function confirmThen(text, run) {
  if (tg && tg.showConfirm) tg.showConfirm(text, (ok) => ok && run());
  else if (confirm(text)) run();
}

$("refresh").onclick = refresh;
$("pause").onclick = () => act(state && state.paused ? "resume" : "pause");
$("flat").onclick = () => confirmThen("Закрыть все позиции по рынку?", () => act("flat"));

document.addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  if (k === "r") refresh();
  if (k === "p") $("pause").click();
  if (k === "f") $("flat").click();
});

refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
