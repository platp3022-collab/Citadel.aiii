services:
  memebot:
    build: .
    container_name: memebot
    env_file: .env
    environment:
      DASHBOARD_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:8420:8420"   # мини-апп со статистикой
    volumes:
      - ./data:/app/data
    restart: always
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
